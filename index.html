<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adroit+ ALPR App</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
    <style>
        :root { --p1: #007bff; --p2: #ffcc00; --active: #00ff00; }
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        #v { width: 100vw; height: 100vh; object-fit: cover; position: absolute; }
        
        /* Dynamic */
        #track-box {
            position: absolute;
            border: 2px solid var(--active);
            border-radius: 4px;
            box-shadow: 0 0 15px var(--active);
            display: none;
            z-index: 10;
            pointer-events: none;
        }

        .ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; }
        .nav { padding: 15px; background: rgba(0,0,0,0.7); display: flex; gap: 10px; pointer-events: auto; }
        .btn { flex: 1; padding: 12px; border-radius: 8px; background: #1a1a1a; color: #fff; border: 1px solid #333; text-align: center; font-size: 11px; font-weight: bold; }
        .btn.active { background: #fff; color: #000; }
        
        .pnl { margin-top: auto; padding: 25px; background: linear-gradient(transparent, rgba(0,0,0,0.9) 30%); text-align: center; pointer-events: auto; }
        .debug-note { font-size: 11px; color: #00ff00; background: rgba(0,0,0,0.6); padding: 5px; border-radius: 4px; margin-bottom: 10px; display: inline-block; min-height: 15px; }
        .num { font-size: 48px; font-weight: 900; color: #fff; min-height: 60px; letter-spacing: 2px; }
        .st { font-size: 9px; color: #555; margin-top: 5px; }
        
        .loader { width: 30px; height: 30px; border: 3px solid transparent; border-top-color: #fff; border-radius: 50%; animation: sp 1s linear infinite; margin: 10px auto; display: none; }
        .busy .loader { display: block; }
        @keyframes sp { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div id="app">
    <video id="v" autoplay playsinline muted></video>
    
    <!-- Dynmic UI Elements -->
    <div id="track-box" :style="boxStyle"></div>

    <div :class="['ui', b ? 'busy' : '']">
        <div class="nav">
            <div :class="['btn', m==='c'?'active':'']" @click="m='c'">ZONE A (中國/中港車牌)</div>
            <div :class="['btn', m==='h'?'active':'']" @click="m='h'">ZONE B (香港/英國車牌)</div>
        </div>
        <div class="pnl">
            <div class="debug-note">[[ {{ debugMsg }} ]]</div>
            <div class="num" :style="{color: rc}">{{ r || '---' }}</div>
            <div class="loader"></div>
            <div class="st">DYNAMIC TRACKING: {{ boxStyle.display === 'block' ? 'LOCKED' : 'SCANNING' }}</div>
        </div>
    </div>
    <!-- Cut the frame -->
    <canvas id="c" style="display:none;"></canvas>
</div>

<script>
const { createApp, ref, onMounted, computed } = Vue;
createApp({
    setup() {
        const r = ref(""), b = ref(false), m = ref("c");
        const debugMsg = ref("WAITING FOR TFJS..."), boxStyle = ref({ display: 'none' });
        const BASE = "https://alpr.cloudence.uk";

        onMounted(async () => {
            try {
                await tf.setBackend('webgl');
                const video = document.getElementById('v');
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: { ideal: 1280 } } 
                });
                video.srcObject = stream;
                
                debugMsg.value = "LOADING COCO-SSD...";
                const net = await cocoSsd.load({ base: 'mobilenet_v2' });
                debugMsg.value = "SYSTEM READY: DYNAMIC MODE";

                const detectFrame = async () => {
                    if (!b.value) {
                        if (video.readyState === 4) {
                            const preds = await net.detect(video, 2, 0.35);
                            const target = preds.find(p => ['car', 'truck', 'bus', 'motorcycle'].includes(p.class));

                            if (target) {
                                // trace the frame
                                const [x, y, w, h] = target.bbox;
                                const sX = window.innerWidth / video.videoWidth;
                                const sY = window.innerHeight / video.videoHeight;
                                
                                boxStyle.value = {
                                    display: 'block',
                                    left: (x * sX) + 'px',
                                    top: (y * sY) + 'px',
                                    width: (w * sX) + 'px',
                                    height: (h * sY) + 'px'
                                };

                                debugMsg.value = `TRACK: ${target.class.toUpperCase()} | CONF: ${Math.round(target.score*100)}%`;
                                triggerOCR(target.bbox);
                            } else {
                                boxStyle.value = { display: 'none' };
                                debugMsg.value = "SEARCHING FOR VEHICLE...";
                            }
                        }
                    }
                    requestAnimationFrame(detectFrame);
                };
                detectFrame();
            } catch (e) { debugMsg.value = "INIT ERR: " + e.message; }
        });

        const triggerOCR = async (bbox) => {
            if (b.value) return;
            const v = document.getElementById('v'), cv = document.getElementById('c');
            b.value = true;

            // dynamic cut：extend 15% to make sure include the plate
            const [x, y, w, h] = bbox;
            const pad = 0.15;
            const cX = Math.max(0, x - w * pad);
            const cY = Math.max(0, y - h * pad);
            const cW = Math.min(v.videoWidth - cX, w * (1 + pad * 2));
            const cH = Math.min(v.videoHeight - cY, h * (1 + pad * 2));

            cv.width = cW; cv.height = cH;
            cv.getContext('2d').drawImage(v, cX, cY, cW, cH, 0, 0, cW, cH);

            debugMsg.value = `>>> CROP & SEND (${Math.round(cW)}x${Math.round(cH)}) <<<`;

            cv.toBlob(async (blob) => {
                try {
                    const fd = new FormData();
                    fd.append('upload', blob, 'crop.jpg');
                    const path = m.value === 'c' ? '/identify_cn' : '/identify_intl';
                    const res = await axios.post(`${BASE}${path}`, fd);
                    if (res.data.status === 'success') {
                        r.value = res.data.plate;
                    }
                } catch (e) { r.value = "OFFLINE"; }
                finally {
                    setTimeout(() => { b.value = false; }, 2000);
                }
            }, 'image/jpeg', 0.85);
        };

        const rc = computed(() => m.value==='c' ? '#007bff' : '#ffcc00');
        return { r, b, m, debugMsg, boxStyle, rc };
    }
}).mount('#app');
</script>
</body>
</html>
