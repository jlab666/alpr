<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Hybrid ALPR - Manual Toggle</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        :root { --hk-color: #ffcc00; --cn-color: #007bff; --black-color: #ffffff; --bg: #000; }
        body { margin: 0; background: var(--bg); color: white; font-family: -apple-system, sans-serif; overflow: hidden; }
        #video { width: 100vw; height: 100vh; object-fit: cover; position: absolute; }
        
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; pointer-events: none; }
        
        /* 頂部切換區 */
        .top-nav { padding: 15px; background: rgba(0,0,0,0.7); display: flex; justify-content: center; gap: 10px; pointer-events: auto; }
        .mode-btn { 
            padding: 8px 15px; border-radius: 8px; border: 1px solid #555; background: #222; color: #888; 
            font-size: 12px; cursor: pointer; transition: 0.3s;
        }
        .mode-btn.active { background: #fff; color: #000; border-color: #fff; font-weight: bold; }

        .viewport { flex: 1; display: flex; align-items: center; justify-content: center; }
        .scan-box { 
            width: 85%; height: 20%; border: 2px solid rgba(255,255,255,0.3); 
            border-radius: 12px; position: relative; transition: 0.3s;
        }
        /* 根據當前路由顯示顏色 */
        .route-cn { border-color: var(--cn-color); box-shadow: 0 0 20px var(--cn-color); }
        .route-hk { border-color: var(--hk-color); box-shadow: 0 0 20px var(--hk-color); }
        .route-black { border-color: var(--black-color); box-shadow: 0 0 20px var(--black-color); }

        .bottom-panel { padding: 25px; background: rgba(0,0,0,0.85); border-top: 1px solid #333; text-align: center; pointer-events: auto; }
        .plate-num { font-size: 42px; font-weight: 900; letter-spacing: 1px; margin-bottom: 5px; }
        .status-msg { font-size: 11px; opacity: 0.5; }
    </style>
</head>
<body>

<div id="app">
    <video id="video" autoplay playsinline muted></video>
    
    <div class="overlay">
        <div class="top-nav">
            <div :class="['mode-btn', configMode === 'auto' ? 'active' : '']" @click="configMode = 'auto'">AUTO 自動</div>
            <div :class="['mode-btn', configMode === 'cn' ? 'active' : '']" @click="configMode = 'cn'">CN/黑牌 (RHEL)</div>
            <div :class="['mode-btn', configMode === 'hk' ? 'active' : '']" @click="configMode = 'hk'">HK/GB (Cloud)</div>
        </div>

        <div class="viewport">
            <div :class="['scan-box', currentRouteClass]">
                <div v-if="isAnalyzing" style="position:absolute; width:100%; top:40%; text-align:center; font-size:12px;">AI 分析中...</div>
            </div>
        </div>

        <div class="bottom-panel">
            <div v-if="lastPlate" class="plate-num" :style="{color: plateColor}">{{ lastPlate }}</div>
            <div v-else style="color:#666;">等待目標...</div>
            <div class="status-msg">
                使用服務: {{ activeServerName }} | 節省 Token: {{ savedCount }}
            </div>
        </div>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>
</div>

<script>
const { createApp, ref, onMounted, computed } = Vue;

createApp({
    setup() {
        const lastPlate = ref("");
        const isAnalyzing = ref(false);
        const configMode = ref("auto"); // auto, cn, hk
        const autoDetectedType = ref("hk"); 
        const savedCount = ref(0);
        const modelReady = ref(false);
        
        const PR_TOKEN = "ad7d94a0aaef7ff209be02490d3f2748430defed";
        const MY_RHEL_URL = "https://translations-gratis-journalists-inputs.trycloudflare.com/identify_cn";

        onMounted(async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            document.getElementById('video').srcObject = stream;
            const net = await cocoSsd.load();
            modelReady.value = true;
            setInterval(() => runLogic(net), 1500);
        });

        const runLogic = async (net) => {
            if (isAnalyzing.value || !modelReady.value) return;
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            if (video.readyState !== 4) return;

            // 1. 本地偵測有沒有車 (節省 Token)
            const predictions = await net.detect(video);
            if (!predictions.some(p => ['car','truck','bus'].includes(p.class))) {
                savedCount.value++;
                return;
            }

            // 2. 自動模式下的顏色分析
            if (configMode.value === "auto") {
                const ctx = canvas.getContext('2d');
                canvas.width = 100; canvas.height = 100;
                ctx.drawImage(video, video.videoWidth*0.25, video.videoHeight*0.4, video.videoWidth*0.5, video.videoHeight*0.2, 0, 0, 100, 100);
                const data = ctx.getImageData(0, 0, 100, 100).data;
                analyzeColor(data);
            }

            // 3. OCR 辨識
            isAnalyzing.value = true;
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);

            canvas.toBlob(async (blob) => {
                try {
                    // 決定走哪條路
                    const useRHEL = configMode.value === "cn" || (configMode.value === "auto" && (autoDetectedType.value === "cn" || autoDetectedType.value === "black"));
                    
                    if (useRHEL) {
                        await callRHEL(blob);
                    } else {
                        await callPR(blob);
                    }
                } finally {
                    isAnalyzing.value = false;
                }
            }, 'image/jpeg', 0.8);
        };

        const analyzeColor = (data) => {
            let r=0, b=0, dark=0;
            for(let i=0; i<data.length; i+=4) {
                if (data[i+2] > data[i] + 15) b++;
                if (data[i] < 50 && data[i+1] < 50 && data[i+2] < 50) dark++;
            }
            if (b > 1500) autoDetectedType.value = "cn";
            else if (dark > 3000) autoDetectedType.value = "black";
            else autoDetectedType.value = "hk";
        };

        const callRHEL = async (blob) => {
            const fd = new FormData();
            fd.append('upload', blob);
            const res = await axios.post(MY_RHEL_URL, fd);
            if (res.data.status === "success") lastPlate.value = res.data.plate;
        };

        const callPR = async (blob) => {
            const fd = new FormData();
            fd.append('upload', blob);
            const res = await axios.post('https://api.platerecognizer.com/v1/plate-reader/', fd, {
                headers: { 'Authorization': `Token ${PR_TOKEN}` }
            });
            if (res.data.results?.length > 0) lastPlate.value = res.data.results[0].plate.toUpperCase();
        };

        // UI 計算屬性
        const currentRouteClass = computed(() => {
            const type = configMode.value === 'auto' ? autoDetectedType.value : configMode.value;
            return `route-${type}`;
        });
        const activeServerName = computed(() => {
            const useRHEL = configMode.value === "cn" || (configMode.value === "auto" && (autoDetectedType.value === "cn" || autoDetectedType.value === "black"));
            return useRHEL ? "RHEL (Free)" : "Cloud (PR)";
        });
        const plateColor = computed(() => {
            const useRHEL = configMode.value === "cn" || (configMode.value === "auto" && (autoDetectedType.value === "cn" || autoDetectedType.value === "black"));
            return useRHEL ? "#007bff" : "#ffcc00";
        });

        return { lastPlate, isAnalyzing, configMode, savedCount, modelReady, currentRouteClass, activeServerName, plateColor };
    }
}).mount('#app');
</script>
</body>
</html>
