<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adroit+ ALPR App</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        :root { --p1: #007bff; --p2: #ffcc00; --active: #00ff00; }
        body { margin: 0; background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
        #v { width: 100vw; height: 100vh; object-fit: cover; position: absolute; }
        .ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; pointer-events: none; }
        .nav { padding: 15px; background: rgba(0,0,0,0.8); display: flex; gap: 10px; pointer-events: auto; }
        .btn { flex: 1; padding: 12px; border-radius: 10px; background: #1a1a1a; color: #888; border: 1px solid #333; font-size: 12px; font-weight: bold; text-align: center; transition: 0.3s; }
        .btn.active { background: #fff; color: #000; border-color: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .vp { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
        .box { width: 80%; height: 20%; border: 2px solid rgba(255,255,255,0.3); border-radius: 15px; transition: 0.2s; position: relative; }
        .is-target { border-color: var(--active) !important; border-width: 4px; box-shadow: 0 0 30px var(--active); }
        .c1 { border-color: var(--p1); }
        .c2 { border-color: var(--p2); }
        .loader { position: absolute; width: 50px; height: 50px; border: 4px solid transparent; border-top-color: #fff; border-radius: 50%; animation: sp 1s linear infinite; display: none; }
        .busy .loader { display: block; }
        @keyframes sp { to { transform: rotate(360deg); } }
        .pnl { padding: 30px; background: linear-gradient(to top, #000 80%, transparent); text-align: center; pointer-events: auto; }
        .num { font-size: 52px; font-weight: 900; min-height: 65px; letter-spacing: 2px; text-shadow: 0 4px 10px rgba(0,0,0,0.8); }
        .debug { font-size: 11px; color: #00ff00; font-family: monospace; margin-bottom: 8px; min-height: 14px; }
        .st { font-size: 10px; color: #555; letter-spacing: 1px; }
    </style>
</head>
<body>
<div id="app">
    <video id="v" autoplay playsinline muted></video>
    <div :class="['ui', b ? 'busy' : '']">
        <div class="nav">
            <div :class="['btn', m==='c'?'active':'']" @click="m='c'">ZONE A (中國/中港車牌)</div>
            <div :class="['btn', m==='h'?'active':'']" @click="m='h'">ZONE B (香港/英國車牌)</div>
        </div>
        <div class="vp">
            <div :class="['box', bx, { 'is-target': hasObj }]"></div>
            <div class="loader"></div>
        </div>
        <div class="pnl">
            <div class="debug">{{ debugMsg || '初始化 AI 模型...' }}</div>
            <div class="num" :style="{color: rc}">{{ r || '---' }}</div>
            <div class="st">SERVER: {{ serverOnline ? 'CONNECTED' : 'OFFLINE' }} | MODE: {{ m==='c'?'CN/LOCAL':'INTL/CLOUD' }}</div>
        </div>
    </div>
    <canvas id="c" style="display:none;"></canvas>
</div>

<script>
const { createApp, ref, onMounted, computed } = Vue;
createApp({
    setup() {
        const r = ref(""), b = ref(false), m = ref("c");
        const ready = ref(false), hasObj = ref(false), debugMsg = ref(""), serverOnline = ref(false);
        const BASE = "https://alpr.cloudence.uk";

        onMounted(async () => {
            try {
                // 1. 檢查伺服器連線
                const check = await axios.get(`${BASE}/ping`);
                if(check.data.status) serverOnline.ref = true;
                
                // 2. 啟動相機
                const s = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: { ideal: 1280 } } 
                });
                document.getElementById('v').srcObject = s;
                
                // 3. 載入物件偵測模型
                const net = await cocoSsd.load();
                ready.value = true;
                debugMsg.value = "系統就緒 - 掃描中";
                
                // 4. 開始偵測循環
                const detectLoop = async () => {
                    if (!b.value) {
                        const v = document.getElementById('v');
                        if (v.readyState === 4) {
                            const preds = await net.detect(v);
                            const found = preds.filter(p => ['car','truck','bus','motorcycle'].includes(p.class) && p.score > 0.5);
                            
                            if (found.length > 0) {
                                hasObj.value = true;
                                debugMsg.value = `偵測到 ${found[0].class} (${Math.round(found[0].score*100)}%)`;
                                triggerOCR();
                            } else {
                                hasObj.value = false;
                                debugMsg.value = "等待車輛進入...";
                            }
                        }
                    }
                    requestAnimationFrame(detectLoop);
                };
                detectLoop();
            } catch (e) {
                debugMsg.value = "啟動失敗: " + e.message;
            }
        });

        const triggerOCR = async () => {
            if (b.value) return;
            const v = document.getElementById('v'), cv = document.getElementById('c');
            b.value = true;
            
            // 擷取影像
            cv.width = 800; 
            cv.height = (v.videoHeight / v.videoWidth) * 800;
            cv.getContext('2d').drawImage(v, 0, 0, cv.width, cv.height);

            cv.toBlob(async (blob) => {
                const path = m.value === 'c' ? "/identify_cn" : "/identify_intl";
                try {
                    const fd = new FormData();
                    fd.append('upload', blob, 'capture.jpg');
                    const res = await axios.post(BASE + path, fd);
                    if (res.data.status === 'success') {
                        r.value = res.data.plate;
                    }
                } catch (e) {
                    r.value = "ERR";
                    console.error(e);
                } finally {
                    // 辨識成功後進入 1.5 秒冷卻，避免重複請求
                    setTimeout(() => { b.value = false; }, 1500);
                }
            }, 'image/jpeg', 0.85);
        };

        const bx = computed(() => m.value==='c' ? 'c1' : 'c2');
        const rc = computed(() => m.value==='c' ? '#007bff' : '#ffcc00');
        
        return { r, b, m, bx, rc, ready, hasObj, debugMsg, serverOnline };
    }
}).mount('#app');
</script>
</body>
</html>
