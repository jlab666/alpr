<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Plate - Character Logic</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        :root { --hk-color: #ffcc00; --cn-color: #007bff; --bg: #000; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; overflow: hidden; }
        #video { width: 100vw; height: 100vh; object-fit: cover; position: absolute; }
        
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; pointer-events: none; }
        .top-info { padding: 15px; background: rgba(0,0,0,0.7); display: flex; justify-content: space-between; pointer-events: auto; }
        
        .scan-container { flex: 1; display: flex; align-items: center; justify-content: center; }
        .scan-box { 
            width: 80%; height: 22%; border: 3px solid rgba(255,255,255,0.4); 
            border-radius: 12px; transition: 0.4s; position: relative;
        }
        /* 視覺反饋：根據偵測到的文字類型變色 */
        .box-cn { border-color: var(--cn-color); box-shadow: 0 0 25px var(--cn-color); }
        .box-hk { border-color: var(--hk-color); box-shadow: 0 0 25px var(--hk-color); }

        .result-area { padding: 25px; background: rgba(0,0,0,0.85); border-top: 1px solid #333; pointer-events: auto; text-align: center; }
        .plate-display { font-size: 40px; font-weight: 900; margin: 5px 0; }
        .label-tag { font-size: 12px; padding: 3px 8px; border-radius: 5px; margin-bottom: 5px; display: inline-block; }
    </style>
</head>
<body>

<div id="app">
    <video id="video" autoplay playsinline muted></video>
    
    <div class="overlay">
        <div class="top-info">
            <span>📡 狀態: {{ modelStatus }}</span>
            <span>節省 Token: {{ savedCount }}</span>
        </div>

        <div class="scan-container">
            <div :class="['scan-box', detectedType === 'CN' ? 'box-cn' : 'box-hk']">
                <div v-if="isAnalyzing" style="position:absolute; width:100%; top:40%; text-align:center;">AI 分析中...</div>
            </div>
        </div>

        <div class="result-area">
            <div v-if="lastPlate">
                <span class="label-tag" :style="{background: detectedType === 'CN' ? '#007bff' : '#ffcc00', color: detectedType === 'CN' ? '#fff' : '#000'}">
                    {{ detectedType === 'CN' ? '偵測到漢字/中港特徵' : '偵測到英數/香港特徵' }}
                </span>
                <div class="plate-display" :style="{color: detectedType === 'CN' ? '#007bff' : '#ffcc00'}">{{ lastPlate }}</div>
            </div>
            <div v-else style="color: #666;">對準車牌自動辨識</div>
            <div style="font-size: 10px; color: #444; margin-top: 10px;">路由: {{ currentRoute }}</div>
        </div>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>
</div>

<script>
const { createApp, ref, onMounted } = Vue;

createApp({
    setup() {
        const lastPlate = ref("");
        const isAnalyzing = ref(false);
        const modelStatus = ref("AI 載入中...");
        const detectedType = ref("HK"); 
        const savedCount = ref(0);
        const currentRoute = ref("Waiting...");
        
        const PR_TOKEN = "ad7d94a0aaef7ff209be02490d3f2748430defed";
        const MY_RHEL_URL = "https://translations-gratis-journalists-inputs.trycloudflare.com/identify_cn";

        onMounted(async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            document.getElementById('video').srcObject = stream;
            
            const net = await cocoSsd.load();
            modelStatus.value = "本地監控中";
            
            // 掃描頻率
            setInterval(() => processFrame(net), 1500);
        });

        const processFrame = async (net) => {
            if (isAnalyzing.value) return;
            const video = document.getElementById('video');
            if (video.readyState !== 4) return;

            // 1. 基礎車輛偵測
            const predictions = await net.detect(video);
            const hasVehicle = predictions.some(p => ['car','truck','bus'].includes(p.class));
            if (!hasVehicle) { savedCount.value++; return; }

            // 2. 邏輯判斷：漢字/顏色複合分析
            // 我們利用 canvas 分析區域
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 200; canvas.height = 100;
            ctx.drawImage(video, video.videoWidth/4, video.videoHeight/4, video.videoWidth/2, video.videoHeight/2, 0, 0, 200, 100);
            
            const imgData = ctx.getImageData(0, 0, 200, 100).data;
            const isChineseStyle = checkChineseFeatures(imgData);
            
            detectedType.value = isChineseStyle ? "CN" : "HK";

            // 3. 執行辨識
            isAnalyzing.value = true;
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);

            canvas.toBlob(async (blob) => {
                try {
                    if (detectedType.value === "CN") {
                        currentRoute.value = "使用 RHEL (HyperLPR - 漢字模式)";
                        await callRHEL(blob);
                    } else {
                        currentRoute.value = "使用 Plate Recognizer (英數模式)";
                        await callPR(blob);
                    }
                } finally {
                    isAnalyzing.value = false;
                }
            }, 'image/jpeg', 0.8);
        };

        const checkChineseFeatures = (data) => {
            let blue = 0, green = 0, dark = 0;
            for(let i=0; i<data.length; i+=4) {
                const r=data[i], g=data[i+1], b=data[i+2];
                // 偵測藍色 (中國普通牌)
                if (b > r + 30 && b > g + 10) blue++;
                // 偵測綠色 (中國新能源牌)
                if (g > r + 30 && g > b + 10) green++;
                // 偵測黑色 (中港兩地牌特徵)
                if (r < 50 && g < 50 && b < 50) dark++;
            }
            // 如果藍/綠/黑特徵明顯，判定為中國/中港格式
            const threshold = data.length / 4 * 0.15; // 15% 面積符合即觸發
            return (blue > threshold || green > threshold || dark > threshold);
        };

        const callRHEL = async (blob) => {
            const fd = new FormData();
            fd.append('upload', blob);
            const res = await axios.post(MY_RHEL_URL, fd);
            if (res.data.status === "success") {
                lastPlate.value = res.data.plate;
                if (window.navigator.vibrate) window.navigator.vibrate(100);
            }
        };

        const callPR = async (blob) => {
            const fd = new FormData();
            fd.append('upload', blob);
            const res = await axios.post('https://api.platerecognizer.com/v1/plate-reader/', fd, {
                headers: { 'Authorization': `Token ${PR_TOKEN}` }
            });
            if (res.data.results?.length > 0) {
                lastPlate.value = res.data.results[0].plate.toUpperCase();
                if (window.navigator.vibrate) window.navigator.vibrate(50);
            }
        };

        return { lastPlate, isAnalyzing, modelStatus, detectedType, savedCount, currentRoute };
    }
}).mount('#app');
</script>
</body>
</html>
