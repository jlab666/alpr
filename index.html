<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 實時車牌偵測 - 穩定版</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000; --error: #ff4444; }
        body { font-family: -apple-system, system-ui; background: var(--bg); color: white; margin: 0; overflow: hidden; }
        
        #video-container { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        #video { width: 100%; height: 100%; object-fit: cover; }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            pointer-events: none;
        }
        .scan-box {
            width: 80%; height: 25%; border: 2px solid var(--primary);
            border-radius: 15px; box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
            position: relative; transition: all 0.3s;
        }
        /* 辨識成功時閃爍 */
        .scan-box.success { background: rgba(0, 255, 136, 0.2); border-width: 4px; }
        
        .scan-line {
            position: absolute; width: 100%; height: 2px; background: var(--primary);
            top: 0; animation: scan 2s linear infinite;
        }
        @keyframes scan { from { top: 0; } to { top: 100%; } }

        .info-panel {
            position: absolute; bottom: 30px; left: 20px; right: 20px;
            background: rgba(20, 20, 20, 0.95); padding: 20px;
            border-radius: 24px; backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .plate-text { font-size: 36px; font-weight: 800; color: var(--primary); letter-spacing: 2px; margin-bottom: 8px; }
        .vehicle-meta { font-size: 14px; color: #aaa; display: flex; flex-wrap: wrap; gap: 8px; }
        .badge { background: #333; padding: 3px 10px; border-radius: 6px; font-size: 12px; color: #fff; }

        .status { position: absolute; top: 30px; left: 20px; display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px; }
        .dot { width: 8px; height: 8px; background: #666; border-radius: 50%; }
        .dot.active { background: var(--primary); box-shadow: 0 0 10px var(--primary); }
    </style>
</head>
<body>

<div id="app">
    <div id="video-container">
        <video id="video" autoplay playsinline></video>
        
        <div class="overlay">
            <div :class="['scan-box', lastResult ? 'success' : '']">
                <div class="scan-line"></div>
            </div>
            <p style="margin-top: 20px; color: var(--primary); font-size: 14px; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">
                對準英國/香港/中國車牌
            </p>
        </div>

        <div class="status">
            <div :class="['dot', isProcessing ? 'active' : '']"></div>
            <span style="font-size: 13px;">{{ isProcessing ? 'AI 分析中...' : '系統就緒' }}</span>
        </div>

        <!-- 偵測結果 -->
        <div v-if="lastResult" class="info-panel">
            <div class="plate-text">{{ lastResult.plate.toUpperCase() }}</div>
            <div class="vehicle-meta">
                <span class="badge">REGION: {{ lastResult.region.toUpperCase() }}</span>
                <span class="badge">SCORE: {{ (lastResult.score * 100).toFixed(0) }}%</span>
                <div style="width: 100%; margin-top: 5px; color: #666; font-size: 12px;">
                    車型顏色功能：{{ mmcEnabled ? '已開啟' : '未開通 (僅限付費版)' }}
                </div>
            </div>
        </div>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>
</div>

<script>
const { createApp, ref, onMounted } = Vue;

createApp({
    setup() {
        const lastResult = ref(null);
        const isProcessing = ref(false);
        const mmcEnabled = ref(false); // 你的 Token 目前不支援 MMC

        // 請確保 Token 正確
        const API_KEY = "ad7d94a0aaef7ff209be02490d3f2748430defed"; 

        onMounted(() => {
            initCamera();
            // 每 2.5 秒掃描一次
            setInterval(captureImage, 2500);
        });

        const initCamera = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: "environment",
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                });
                document.getElementById('video').srcObject = stream;
            } catch (err) {
                alert("相機啟動失敗，請檢查 HTTPS 環境或權限設置。");
            }
        };

        const captureImage = async () => {
            if (isProcessing.value) return;

            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            if (video.readyState !== 4) return;

            // 設置 Canvas 大小與影片流一致
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);

            isProcessing.value = true;

            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('upload', blob);
                formData.append('regions', 'gb,hk,cn'); 
                
                // 注意：這裡暫不添加 mmc: true，以防免費版 Token 報錯
                // formData.append('mmc', 'true'); 

                try {
                    const response = await axios.post('https://api.platerecognizer.com/v1/plate-reader/', formData, {
                        headers: { 'Authorization': `Token ${API_KEY}` }
                    });

                    if (response.data.results && response.data.results.length > 0) {
                        lastResult.value = response.data.results[0];
                        
                        // 觸發成功震動
                        if (window.navigator.vibrate) window.navigator.vibrate(100);
                        
                        // 3秒後移除成功狀態，以便下次閃爍
                        setTimeout(() => {
                            // 保持結果顯示，但移除框框高亮
                        }, 2000);
                    }
                } catch (error) {
                    console.error("API Error:", error);
                    // 如果 API 返回 403，通常是 Token 問題或請求了未授權的功能（如 MMC）
                    if (error.response?.status === 403) {
                        console.log("提示：請檢查 Token 是否有效或是否請求了未授權功能。");
                    }
                } finally {
                    isProcessing.value = false;
                }
            }, 'image/jpeg', 0.8);
        };

        return { lastResult, isProcessing, mmcEnabled };
    }
}).mount('#app');
</script>

</body>
</html>
