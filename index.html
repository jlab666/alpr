<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Hybrid ALPR - Pro Version</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <style>
        :root { --hk: #ffcc00; --cn: #007bff; --black: #ffffff; --bg: #000; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; overflow: hidden; }
        #video { width: 100vw; height: 100vh; object-fit: cover; position: absolute; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; pointer-events: none; }
        .top-nav { padding: 15px; background: rgba(0,0,0,0.8); display: flex; justify-content: center; gap: 8px; pointer-events: auto; }
        .btn { padding: 10px; border-radius: 8px; border: 1px solid #444; background: #111; color: #777; font-size: 11px; flex: 1; text-align: center; }
        .btn.active { background: #fff; color: #000; font-weight: bold; }
        .viewport { flex: 1; display: flex; align-items: center; justify-content: center; }
        .scan-box { width: 85%; height: 20%; border: 2px solid rgba(255,255,255,0.3); border-radius: 12px; transition: 0.3s; position: relative; }
        .route-cn { border-color: var(--cn); box-shadow: 0 0 20px var(--cn); }
        .route-hk { border-color: var(--hk); box-shadow: 0 0 20px var(--hk); }
        .route-black { border-color: var(--black); box-shadow: 0 0 20px var(--black); }
        .bottom-panel { padding: 25px; background: rgba(0,0,0,0.9); border-top: 1px solid #333; text-align: center; pointer-events: auto; }
        .plate-num { font-size: 45px; font-weight: 900; line-height: 1.2; }
        .status-text { font-size: 10px; color: #555; margin-top: 8px; }
    </style>
</head>
<body>
<div id="app">
    <video id="video" autoplay playsinline muted></video>
    <div class="overlay">
        <div class="top-nav">
            <div :class="['btn', mode==='auto'?'active':'']" @click="mode='auto'">AUTO</div>
            <div :class="['btn', mode==='cn'?'active':'']" @click="mode='cn'">CHINA/粵Z (RHEL)</div>
            <div :class="['btn', mode==='hk'?'active':'']" @click="mode='hk'">HK/GB (Cloud)</div>
        </div>
        <div class="viewport">
            <div :class="['scan-box', boxClass]">
                <div v-if="isAnalyzing" style="position:absolute; width:100%; top:45%; text-align:center; font-size:12px;">OCR Processing...</div>
            </div>
        </div>
        <div class="bottom-panel">
            <div v-if="lastPlate" class="plate-num" :style="{color: plateColor}">{{ lastPlate }}</div>
            <div v-else style="font-size:30px; font-weight:900; color:#333;">SCANNING</div>
            <div class="status-text">Server: {{ activeServer }} | Saved: {{ saved }}</div>
        </div>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>
</div>

<script>
const { createApp, ref, onMounted, computed } = Vue;
createApp({
    setup() {
        const lastPlate = ref("");
        const isAnalyzing = ref(false);
        const mode = ref("auto");
        const autoType = ref("hk");
        const saved = ref(0);
        const netReady = ref(false);
        const RHEL_URL = "https://surrey-buyer-think-vegetarian.trycloudflare.com/identify_cn";
        const PR_TOKEN = "ad7d94a0aaef7ff209be02490d3f2748430defed";

        onMounted(async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: 1280, height: 720 } });
            document.getElementById('video').srcObject = stream;
            const net = await cocoSsd.load();
            netReady.value = true;
            setInterval(() => run(net), 1500);
        });

        const run = async (net) => {
            if (isAnalyzing.value || !netReady.value) return;
            const video = document.getElementById('video');
            if (video.readyState !== 4) return;

            const pred = await net.detect(video);
            if (!pred.some(p => ['car','truck','bus'].includes(p.class))) { saved.value++; return; }

            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            if (mode.value === "auto") {
                canvas.width = 100; canvas.height = 100;
                ctx.drawImage(video, video.videoWidth*0.25, video.videoHeight*0.4, video.videoWidth*0.5, video.videoHeight*0.2, 0, 0, 100, 100);
                const d = ctx.getImageData(0,0,100,100).data;
                let b=0, dark=0;
                for(let i=0; i<d.length; i+=4) {
                    if (d[i+2] > d[i]+15) b++;
                    if (d[i]<50 && d[i+1]<50 && d[i+2]<50) dark++;
                }
                autoType.value = (b>1200) ? "cn" : (dark>3000 ? "black" : "hk");
            }

            isAnalyzing.value = true;
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);
            canvas.toBlob(async (blob) => {
                const useRHEL = mode.value === "cn" || (mode.value === "auto" && (autoType.value === "cn" || autoType.value === "black"));
                try {
                    const fd = new FormData(); fd.append('upload', blob);
                    if (useRHEL) {
                        const res = await axios.post(RHEL_URL, fd);
                        if (res.data.status === "success") lastPlate.value = res.data.plate;
                    } else {
                        const res = await axios.post('https://api.platerecognizer.com/v1/plate-reader/', fd, { headers: { 'Authorization': `Token ${PR_TOKEN}` } });
                        if (res.data.results?.length > 0) lastPlate.value = res.data.results[0].plate.toUpperCase();
                    }
                } finally { isAnalyzing.value = false; }
            }, 'image/jpeg', 0.95);
        };

        const boxClass = computed(() => `route-${mode.value === 'auto' ? autoType.value : (mode.value==='cn'?'cn':'hk')}`);
        const activeServer = computed(() => (mode.value==='cn' || (mode.value==='auto' && (autoType.value==='cn'||autoType.value==='black'))) ? 'RHEL (HyperLPR)' : 'Cloud (PR)');
        const plateColor = computed(() => activeServer.value.includes('RHEL') ? '#007bff' : '#ffcc00');

        return { lastPlate, isAnalyzing, mode, saved, boxClass, activeServer, plateColor };
    }
}).mount('#app');
</script>
</body>
</html>
