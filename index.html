<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LPR Debugger</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: monospace; overflow: hidden; }
        #video { width: 100vw; height: 100vh; object-fit: cover; position: absolute; }
        .ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* Debug Log 視窗 */
        #log-window { 
            position: absolute; top: 10px; left: 10px; right: 10px; 
            height: 120px; background: rgba(0,0,0,0.7); 
            font-size: 12px; padding: 10px; overflow-y: auto; border: 1px solid #333;
            pointer-events: auto;
        }

        .btn-capture {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 80px; height: 80px; background: rgba(255,255,255,0.3);
            border: 5px solid #fff; border-radius: 50%; pointer-events: auto;
        }
        .btn-capture:active { background: #fff; }

        .result-box {
            position: absolute; bottom: 140px; left: 20px; right: 20px;
            background: rgba(0, 255, 136, 0.9); color: #000; padding: 15px;
            border-radius: 10px; font-weight: bold; pointer-events: auto;
        }
    </style>
</head>
<body>

<div id="app">
    <video id="video" autoplay playsinline></video>
    
    <div class="ui">
        <!-- Debug Console -->
        <div id="log-window">
            <div>[System] 正在初始化...</div>
            <div v-for="log in logs" :key="log">{{ log }}</div>
        </div>

        <!-- 掃描結果 -->
        <div v-if="lastResult" class="result-box">
            <div>車牌：{{ lastResult.plate.toUpperCase() }}</div>
            <div>地區：{{ lastResult.region.toUpperCase() }}</div>
            <div style="font-size: 12px">信心度：{{ (lastResult.score*100).toFixed(1) }}%</div>
        </div>

        <!-- 手動拍照按鈕 -->
        <div class="btn-capture" @click="doCapture"></div>
    </div>
    
    <canvas id="canvas" style="display:none;"></canvas>
</div>

<script>
const { createApp, ref, onMounted } = Vue;

createApp({
    setup() {
        const logs = ref([]);
        const lastResult = ref(null);
        const isProcessing = ref(false);
        const API_KEY = "ad7d94a0aaef7ff209be02490d3f2748430defed";

        const addLog = (msg) => {
            logs.value.unshift(`[${new Date().toLocaleTimeString()}] ${msg}`);
            if (logs.value.length > 5) logs.value.pop();
        };

        onMounted(async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                document.getElementById('video').srcObject = stream;
                addLog("相機啟動成功");
            } catch (err) {
                addLog("相機出錯: " + err.message);
            }
        });

        const doCapture = async () => {
            if (isProcessing.value) return;
            isProcessing.value = true;
            addLog("正在拍照辨識...");

            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);

            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('upload', blob);
                formData.append('regions', 'gb,hk,cn');

                try {
                    const res = await axios.post('https://api.platerecognizer.com/v1/plate-reader/', formData, {
                        headers: { 'Authorization': `Token ${API_KEY}` }
                    });

                    if (res.data.results && res.data.results.length > 0) {
                        lastResult.value = res.data.results[0];
                        addLog("辨識成功: " + res.data.results[0].plate);
                    } else {
                        addLog("API 成功但無結果 (沒對準?)");
                    }
                } catch (err) {
                    const status = err.response?.status;
                    const detail = err.response?.data?.detail || err.message;
                    addLog(`錯誤(${status}): ${detail}`);
                } finally {
                    isProcessing.value = false;
                }
            }, 'image/jpeg', 0.8);
        };

        return { logs, lastResult, isProcessing, doCapture };
    }
}).mount('#app');
</script>
</body>
</html>
