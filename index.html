<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Smart LPR - TFJS Filter</title>
    
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

    <style>
        :root { --primary: #00ff88; --warn: #ffcc00; --bg: #000; }
        body { margin: 0; background: var(--bg); color: white; font-family: -apple-system, sans-serif; overflow: hidden; }
        
        #video { width: 100vw; height: 100vh; object-fit: cover; position: absolute; }

        .scan-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            pointer-events: none;
        }
        
        /* 增加掃描框顏色變化 */
        .scan-box {
            width: 80%; height: 25%; border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px; position: relative; transition: all 0.3s;
        }
        .scan-box.detecting { border-color: var(--warn); box-shadow: 0 0 15px var(--warn); }
        .scan-box.identifying { border-color: var(--primary); box-shadow: 0 0 20px var(--primary); }

        .scan-line {
            position: absolute; width: 100%; height: 2px; background: var(--primary);
            top: 0; animation: scan 2s linear infinite; display: none;
        }
        .identifying .scan-line { display: block; }

        @keyframes scan { from { top: 0; } to { top: 100%; } }

        .instant-result {
            margin-top: 30px; background: var(--primary); color: #000;
            padding: 10px 30px; border-radius: 50px; font-size: 32px;
            font-weight: 900; letter-spacing: 2px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .status-ui {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 12px; background: rgba(0,0,0,0.5); padding: 8px 15px; border-radius: 20px;
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .dot.red { background: #ff4444; }
        .dot.green { background: var(--primary); }
    </style>
</head>
<body>

<div id="app">
    <video id="video" autoplay playsinline muted></video>
    
    <div class="scan-layer">
        <div :class="['scan-box', hasVehicle ? 'detecting' : '', isAnalyzing ? 'identifying' : '']">
            <div class="scan-line"></div>
        </div>

        <div v-if="lastPlate" class="instant-result">
            {{ lastPlate }}
        </div>
        
        <div style="margin-top: 20px; color: #fff; font-size: 14px; background: rgba(0,0,0,0.6); padding: 5px 15px; border-radius: 10px;">
            {{ aiStatus }}
        </div>
    </div>

    <div class="status-ui">
        <div>
            <span :class="['dot', modelLoaded ? 'green' : 'red']"></span>
            本地 AI: {{ modelLoaded ? 'ON' : 'LOADING' }}
        </div>
        <div>已呼叫 API: {{ tokenUsed }} 次</div>
    </div>
    
    <canvas id="canvas" style="display:none;"></canvas>
</div>

<script>
const { createApp, ref, onMounted } = Vue;

createApp({
    setup() {
        const lastPlate = ref("");
        const isAnalyzing = ref(false);
        const hasVehicle = ref(false);
        const modelLoaded = ref(false);
        const aiStatus = ref("正在初始化本地 AI...");
        const tokenUsed = ref(0);
        
        let net = null;
        const API_KEY = "ad7d94a0aaef7ff209be02490d3f2748430defed";

        onMounted(async () => {
            await initCamera();
            await loadLocalAI();
            // 開始循環監測 (本地偵測可以跑快啲，因為唔洗錢)
            setInterval(smartScanner, 800); 
        });

        const loadLocalAI = async () => {
            try {
                // 加載輕量級 COCO-SSD 模型
                net = await cocoSsd.load();
                modelLoaded.value = true;
                aiStatus.value = "等待偵測車輛...";
            } catch (e) {
                aiStatus.value = "AI 加載失敗，請檢查網絡";
            }
        };

        const initCamera = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
            });
            document.getElementById('video').srcObject = stream;
        };

        const smartScanner = async () => {
            if (!modelLoaded.value || isAnalyzing.value) return;

            const video = document.getElementById('video');
            if (video.readyState !== 4) return;

            // --- STEP 1: 本地 AI 預檢 (FREE) ---
            const predictions = await net.detect(video);
            
            // 檢查有沒有車輛類目標
            const vehicleDetected = predictions.some(p => 
                ['car', 'truck', 'bus', 'motorcycle'].includes(p.class) && p.score > 0.6
            );

            hasVehicle.value = vehicleDetected;

            if (vehicleDetected) {
                aiStatus.value = "⚡ 發現目標！正在提取車牌...";
                await captureAndRecognize();
            } else {
                aiStatus.value = "掃描中：未發現車輛";
            }
        };

        const captureAndRecognize = async () => {
            isAnalyzing.value = true;
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);

            return new Promise((resolve) => {
                canvas.toBlob(async (blob) => {
                    const formData = new FormData();
                    formData.append('upload', blob);

                    try {
                        const res = await axios.post('https://api.platerecognizer.com/v1/plate-reader/', formData, {
                            headers: { 'Authorization': `Token ${API_KEY}` }
                        });

                        tokenUsed.value++; // 記錄 API 使用次數

                        if (res.data.results && res.data.results.length > 0) {
                            const newPlate = res.data.results[0].plate.toUpperCase();
                            lastPlate.value = newPlate;
                            if (window.navigator.vibrate) window.navigator.vibrate(100);
                            
                            // 識別成功後暫停一下，避免對著同一架車猛刷 Token
                            await new Promise(r => setTimeout(r, 3000));
                        }
                    } catch (err) {
                        console.error("API Error:", err);
                    } finally {
                        isAnalyzing.value = false;
                        resolve();
                    }
                }, 'image/jpeg', 0.7);
            });
        };

        return { lastPlate, isAnalyzing, hasVehicle, modelLoaded, aiStatus, tokenUsed };
    }
}).mount('#app');
</script>
</body>
</html>
