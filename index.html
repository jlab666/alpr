<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adroit+ ALPR App</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    
    <!-- loging tfjs core，then coco-ssd -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

    <style>
        :root { --p1: #007bff; --p2: #ffcc00; --active: #00ff00; }
        body { margin: 0; background: #000; color: #fff; font-family: 'Courier New', Courier, monospace; overflow: hidden; }
        #v { width: 100vw; height: 100vh; object-fit: cover; position: absolute; }
        .ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; pointer-events: none; }
        .nav { padding: 15px; background: rgba(0,0,0,0.85); display: flex; gap: 10px; pointer-events: auto; }
        .btn { flex: 1; padding: 12px; border-radius: 10px; background: #1a1a1a; color: #666; border: 1px solid #333; font-size: 11px; font-weight: bold; text-align: center; }
        .btn.active { background: #fff; color: #000; border-color: #fff; }
        .vp { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
        .box { width: 85%; height: 25%; border: 2px solid rgba(255,255,255,0.2); border-radius: 15px; transition: 0.1s; position: relative; }
        .is-target { border-color: var(--active) !important; border-width: 4px; box-shadow: 0 0 25px var(--active); }
        .loader { position: absolute; width: 50px; height: 50px; border: 4px solid transparent; border-top-color: #fff; border-radius: 50%; animation: sp 1s linear infinite; display: none; }
        .busy .loader { display: block; }
        @keyframes sp { to { transform: rotate(360deg); } }
        .pnl { padding: 20px; background: rgba(0,0,0,0.9); text-align: center; pointer-events: auto; }
        .debug-note { font-size: 11px; color: #00ff00; margin-bottom: 5px; min-height: 14px; }
        .num { font-size: 50px; font-weight: 900; min-height: 62px; letter-spacing: 2px; }
        .st { font-size: 9px; color: #555; }
    </style>
</head>
<body>
<div id="app">
    <video id="v" autoplay playsinline muted></video>
    <div :class="['ui', b ? 'busy' : '']">
        <div class="nav">
            <div :class="['btn', m==='c'?'active':'']" @click="m='c'">ZONE A (中國/中港車牌)</div>
            <div :class="['btn', m==='h'?'active':'']" @click="m='h'">ZONE B (香港/英國車牌)</div>
        </div>
        <div class="vp">
            <div :class="['box', { 'is-target': hasObj }]"></div>
            <div class="loader"></div>
        </div>
        <div class="pnl">
            <div class="debug-note">[[ {{ debugNote }} ]]</div>
            <div class="num" :style="{color: rc}">{{ r || '---' }}</div>
            <div class="st">Adroit+ ALPR | {{ b ? 'IDENTIFYING' : 'READY' }}</div>
        </div>
    </div>
    <canvas id="c" style="display:none;"></canvas>
</div>

<script>
const { createApp, ref, onMounted, computed } = Vue;
createApp({
    setup() {
        const r = ref(""), b = ref(false), m = ref("c");
        const ready = ref(false), hasObj = ref(false), debugNote = ref("Loading engine...");
        const BASE = "https://alpr.cloudence.uk";

        onMounted(async () => {
            try {
                // Using WebGL to speed up
                await tf.setBackend('webgl');
                
                const s = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: { ideal: 1280 } } 
                });
                document.getElementById('v').srcObject = s;
                
                // 設定預測參數：限制偵測數量為 3，提高速度
                const net = await cocoSsd.load({ base: 'mobilenet_v2' }); 
                ready.value = true;
                debugNote.value = "極速模式已啟動";
                
                // 使用效能更好的偵測迴圈
                const detectFrame = async () => {
                    if (b.value || !ready.value) {
                        setTimeout(detectFrame, 200); // 辨識中降低偵測頻率
                        return;
                    }

                    const v = document.getElementById('v');
                    if (v.readyState === 4) {
                        // 核心優化：限制偵測目標數量與信心門檻
                        const preds = await net.detect(v, 3, 0.3); 
                        
                        const target = preds.find(p => 
                            ['car','truck','bus','motorcycle'].includes(p.class)
                        );
                        
                        if (target) {
                            hasObj.value = true;
                            debugNote.value = `HIT: ${target.class.toUpperCase()}`;
                            triggerOCR(); // 偵測到立刻閃擊
                        } else {
                            hasObj.value = false;
                            debugNote.value = "SCANNING...";
                        }
                    }
                    // 每 100ms 執行一次偵測 (10 FPS)，平衡功耗與速度
                    setTimeout(detectFrame, 100); 
                };
                detectFrame();
            } catch (e) { debugNote.value = "INIT ERR: " + e.message; }
        });

        const triggerOCR = async () => {
            if (b.value) return;
            const v = document.getElementById('v'), cv = document.getElementById('c');
            b.value = true;
            
            // 縮小圖片尺寸發送給後端 (800px -> 600px) 加快網路傳輸
            cv.width = 600; 
            cv.height = (v.videoHeight / v.videoWidth) * 600;
            cv.getContext('2d').drawImage(v, 0, 0, cv.width, cv.height);

            cv.toBlob(async (blob) => {
                try {
                    const fd = new FormData();
                    fd.append('upload', blob, 'img.jpg');
                    const res = await axios.post(`${BASE}${m.value==='c'?'/identify_cn':'/identify_intl'}`, fd);
                    if (res.data.status === 'success') r.value = res.data.plate;
                } catch (e) { r.value = "OFFLINE"; }
                finally {
                    // 辨識完後立即開放下一波偵測
                    setTimeout(() => { b.value = false; }, 800); 
                }
            }, 'image/jpeg', 0.75); // 稍微降低畫質換取傳輸速度
        };

        const rc = computed(() => m.value==='c' ? '#007bff' : '#ffcc00');
        return { r, b, m, ready, hasObj, debugNote, rc };
    }
}).mount('#app');
</script>
</body>
</html>
