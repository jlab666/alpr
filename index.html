<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Plate Instant Stream</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #000; }
        body { margin: 0; background: var(--bg); color: white; font-family: -apple-system, sans-serif; overflow: hidden; }
        
        #video { width: 100vw; height: 100vh; object-fit: cover; position: absolute; }

        /* 掃描對準框 */
        .scan-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            pointer-events: none;
        }
        .scan-box {
            width: 80%; height: 25%; border: 2px solid var(--primary);
            border-radius: 15px; box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
            position: relative;
        }
        .scan-line {
            position: absolute; width: 100%; height: 2px; background: var(--primary);
            top: 0; animation: scan 2s linear infinite;
        }
        @keyframes scan { from { top: 0; } to { top: 100%; } }

        /* 即時結果浮現 */
        .instant-result {
            margin-top: 30px;
            background: rgba(0, 255, 136, 0.9);
            color: #000;
            padding: 10px 30px;
            border-radius: 50px;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .status-dot {
            position: absolute; top: 20px; left: 20px;
            display: flex; align-items: center; gap: 8px; font-size: 12px;
        }
        .dot { width: 10px; height: 10px; background: #555; border-radius: 50%; }
        .dot.active { background: var(--primary); box-shadow: 0 0 10px var(--primary); }
    </style>
</head>
<body>

<div id="app">
    <video id="video" autoplay playsinline></video>
    
    <div class="scan-layer">
        <div class="scan-box">
            <div class="scan-line"></div>
        </div>

        <!-- 辨識到就即刻喺呢度顯示號碼 -->
        <div v-if="lastPlate" class="instant-result">
            {{ lastPlate }}
        </div>
        <div v-else style="margin-top: 20px; color: rgba(255,255,255,0.5)">
            {{ isAnalyzing ? '🔍 正在辨識中...' : '請對準車牌' }}
        </div>
    </div>

    <div class="status-dot">
        <div :class="['dot', isAnalyzing ? 'active' : '']"></div>
        <span>{{ isAnalyzing ? 'AI STREAMING' : 'READY' }}</span>
    </div>
    
    <canvas id="canvas" style="display:none;"></canvas>
</div>

<script>
const { createApp, ref, onMounted } = Vue;

createApp({
    setup() {
        const lastPlate = ref("");
        const isAnalyzing = ref(false);
        const API_KEY = "ad7d94a0aaef7ff209be02490d3f2748430defed"; // 根據你截圖證實可用

        onMounted(async () => {
            await initCamera();
            // 每 1.5 秒自動影一張送去 API
            setInterval(autoStreamScan, 1500);
        });

        const initCamera = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: 1280, height: 720 } 
            });
            document.getElementById('video').srcObject = stream;
        };

        const autoStreamScan = async () => {
            if (isAnalyzing.value) return;
            
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            if (video.readyState !== 4) return;

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);

            isAnalyzing.value = true;

            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('upload', blob);

                try {
                    const res = await axios.post('https://api.platerecognizer.com/v1/plate-reader/', formData, {
                        headers: { 'Authorization': `Token ${API_KEY}` }
                    });

                    if (res.data.results && res.data.results.length > 0) {
                        const newPlate = res.data.results[0].plate.toUpperCase();
                        // 只有當認到新車牌或結果唔同先更新，避免畫面閃爍
                        if (lastPlate.value !== newPlate) {
                            lastPlate.value = newPlate;
                            if (window.navigator.vibrate) window.navigator.vibrate(50);
                        }
                    }
                } catch (err) {
                    console.error("Stream Error:", err);
                } finally {
                    isAnalyzing.value = false;
                }
            }, 'image/jpeg', 0.7);
        };

        return { lastPlate, isAnalyzing };
    }
}).mount('#app');
</script>
</body>
</html>
